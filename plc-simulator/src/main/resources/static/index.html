<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PLC 模拟器 (双DB对比)</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <style>
        body { padding: 20px; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #eef2f5; }
        .top-bar { background: #fff; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; }
        .card-header { font-weight: bold; font-size: 16px; text-align: center; }
        .header-db10 { color: #409EFF; }
        .header-db11 { color: #67C23A; }
    </style>
</head>
<body>
<div id="app">
    <div class="top-bar">
        <div style="font-size: 18px; font-weight: bold; color: #303133;">
            托盘线 PLC 通讯模拟器 (S7 102端口已启动)
        </div>
        <div>
            <span style="margin-right: 10px; color: #606266;">当前设备号 (UnitIndex) Offset=100+(N-1)*100:</span>
            <el-input-number v-model="unitIndex" :min="1" :max="300" style="width: 130px; margin-right: 15px;"></el-input-number>
            <el-button type="primary" @click="loadData" :loading="loading">读取内存数据</el-button>
            <el-button type="success" @click="saveData" :loading="loading">保存修改至内存</el-button>
            <el-button type="warning" plain @click="goToClient" style="margin-left: 15px;">通用调试工具 &gt;</el-button>
        </div>
    </div>

    <el-row :gutter="20">
        <el-col :span="12">
            <el-card shadow="hover">
                <template #header>
                    <div class="card-header header-db10">
                        DB 10 (PLC 数据流向 -> PC)
                        <span style="font-size: 12px; font-weight: normal; color: #909399;">(你的业务系统从此块读取)</span>
                    </div>
                </template>
                <el-form :model="formData.db10" label-width="160px" size="small">
                    <el-form-item label="设备号(Device_Nr)"><el-input v-model.number="formData.db10.deviceNr"></el-input></el-form-item>
                    <el-form-item label="占位标志(Occupied)"><el-input v-model.number="formData.db10.occupied"></el-input></el-form-item>
                    <el-form-item label="请求序号(RSN)"><el-input v-model.number="formData.db10.rsn"></el-input></el-form-item>
                    <el-form-item label="请求代码(RC)"><el-input v-model.number="formData.db10.rc"></el-input></el-form-item>
                    <el-form-item label="请求数量(RQ)"><el-input v-model.number="formData.db10.rq"></el-input></el-form-item>
                    <el-form-item label="备用1(Spare1)"><el-input v-model.number="formData.db10.spare1"></el-input></el-form-item>
                    <el-form-item label="任务号(Task_ID)"><el-input v-model.number="formData.db10.taskId"></el-input></el-form-item>
                    <el-form-item label="目的地(Dest_Nr)"><el-input v-model.number="formData.db10.destNr"></el-input></el-form-item>
                    <el-form-item label="外检信息(Countour)"><el-input v-model.number="formData.db10.countour"></el-input></el-form-item>
                    <el-form-item label="托盘重量(Weight)"><el-input v-model.number="formData.db10.weight"></el-input></el-form-item>
                    <el-form-item label="托盘条码(Barcode)"><el-input v-model="formData.db10.barcode" maxlength="16"></el-input></el-form-item>
                    <el-form-item label="备用条码(Barcode_Spare)"><el-input v-model="formData.db10.barcodeSpare" maxlength="16"></el-input></el-form-item>
                    <el-form-item label="类型(Type)"><el-input v-model.number="formData.db10.type"></el-input></el-form-item>
                    <el-form-item label="写入标志(Comp_Mark)"><el-input v-model.number="formData.db10.completionMark"></el-input></el-form-item>
                    <el-form-item label="指令序号(PC_Cmd_SN_Ack)"><el-input v-model.number="formData.db10.pcCmdSnAck"></el-input></el-form-item>
                    <el-form-item label="指令编码(PC_Cmd_Crl_Ack)"><el-input v-model.number="formData.db10.pcCmdCrlAck"></el-input></el-form-item>
                    <el-form-item label="数据有效性(Data_Valid)"><el-input v-model.number="formData.db10.dataValid"></el-input></el-form-item>
                </el-form>
            </el-card>
        </el-col>

        <el-col :span="12">
            <el-card shadow="hover">
                <template #header>
                    <div class="card-header header-db11">
                        DB 11 (PC 数据流向 -> PLC)
                        <span style="font-size: 12px; font-weight: normal; color: #909399;">(你的业务系统写入此块)</span>
                    </div>
                </template>
                <el-form :model="formData.db11" label-width="160px" size="small">
                    <el-form-item label="设备号(Device_Nr)"><el-input v-model.number="formData.db11.deviceNr"></el-input></el-form-item>
                    <el-form-item label="占位标志(Occupied)"><el-input v-model.number="formData.db11.occupied"></el-input></el-form-item>
                    <el-form-item label="请求序号(RSN)"><el-input v-model.number="formData.db11.rsn"></el-input></el-form-item>
                    <el-form-item label="请求代码(RC)"><el-input v-model.number="formData.db11.rc"></el-input></el-form-item>
                    <el-form-item label="请求数量(RQ)"><el-input v-model.number="formData.db11.rq"></el-input></el-form-item>
                    <el-form-item label="备用1(Spare1)"><el-input v-model.number="formData.db11.spare1"></el-input></el-form-item>
                    <el-form-item label="任务号(Task_ID)"><el-input v-model.number="formData.db11.taskId"></el-input></el-form-item>
                    <el-form-item label="目的地(Dest_Nr)"><el-input v-model.number="formData.db11.destNr"></el-input></el-form-item>
                    <el-form-item label="外检信息(Countour)"><el-input v-model.number="formData.db11.countour"></el-input></el-form-item>
                    <el-form-item label="托盘重量(Weight)"><el-input v-model.number="formData.db11.weight"></el-input></el-form-item>
                    <el-form-item label="托盘条码(Barcode)"><el-input v-model="formData.db11.barcode" maxlength="16"></el-input></el-form-item>
                    <el-form-item label="备用条码(Barcode_Spare)"><el-input v-model="formData.db11.barcodeSpare" maxlength="16"></el-input></el-form-item>
                    <el-form-item label="类型(Type)"><el-input v-model.number="formData.db11.type"></el-input></el-form-item>
                    <el-form-item label="写入标志(Comp_Mark)"><el-input v-model.number="formData.db11.completionMark"></el-input></el-form-item>
                    <el-form-item label="指令序号(PC_Cmd_SN_Ack)"><el-input v-model.number="formData.db11.pcCmdSnAck"></el-input></el-form-item>
                    <el-form-item label="指令编码(PC_Cmd_Crl_Ack)"><el-input v-model.number="formData.db11.pcCmdCrlAck"></el-input></el-form-item>
                    <el-form-item label="数据有效性(Data_Valid)"><el-input v-model.number="formData.db11.dataValid"></el-input></el-form-item>
                </el-form>
            </el-card>
        </el-col>
    </el-row>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>

<script>
    const { createApp, ref, onMounted, watch } = Vue
    const { ElMessage } = ElementPlus

    const app = createApp({
        setup() {
            const unitIndex = ref(1)
            const loading = ref(false)

            const createEmptyDb = () => ({
                deviceNr: 0, occupied: 0, rsn: 0, rc: 0, rq: 0, spare1: 0,
                taskId: 0, destNr: 0, countour: 0, weight: 0, barcode: '', barcodeSpare: '',
                type: 0, completionMark: 0, pcCmdSnAck: 0, pcCmdCrlAck: 0, dataValid: 0
            })

            const formData = ref({
                unitIndex: 1,
                db10: createEmptyDb(),
                db11: createEmptyDb()
            })

            watch(unitIndex, (newVal) => {
                if (formData.value.db10) {
                    formData.value.db10.deviceNr = newVal;
                }
                if (formData.value.db11) {
                    formData.value.db11.deviceNr = newVal;
                }
            })

            const loadData = async () => {
                loading.value = true;
                try {
                    const res = await axios.get(`/api/plc/unit/${unitIndex.value}`);
                    formData.value = res.data;
                    ElMessage.success(`读取设备 [${unitIndex.value}] DB10/DB11 数据成功`);
                } catch (error) {
                    ElMessage.error('读取内存失败');
                }
                loading.value = false;
            }

            const saveData = async () => {
                loading.value = true;
                try {
                    formData.value.unitIndex = unitIndex.value;
                    await axios.post('/api/plc/unit', formData.value);
                    ElMessage.success('已同步写入到 S7Server 内存！');
                } catch (error) {
                    ElMessage.error('写入内存失败');
                }
                loading.value = false;
            }

            onMounted(() => {
                loadData()
            })

            const goToClient = () => {
                window.location.href = '/client.html';
            }

            return { unitIndex, formData, loadData, saveData, loading, goToClient }
        }
    })
    app.use(ElementPlus)
    app.mount('#app')
</script>
</body>
</html>
